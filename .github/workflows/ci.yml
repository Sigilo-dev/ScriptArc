name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: check version consistency
        run: pnpm check:version
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: tests
        run: pnpm test
      - name: build frontend
        run: pnpm build
